services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: downloader
      POSTGRES_USER: downloader
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env}
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:?Run python tools/setup_services.py to configure POSTGRES_PORT}
        host_ip: 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downloader -d downloader"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - target: 6379
        published: ${REDIS_PORT:?Run python tools/setup_services.py to configure REDIS_PORT}
        host_ip: 127.0.0.1
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-state:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - target: 6379
        published: ${REDIS_STATE_PORT:-6380}
        host_ip: 127.0.0.1
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_STATE_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_state_data:
