services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: downloader
      POSTGRES_USER: downloader
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downloader -d downloader"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - target: 6379
        host_ip: 127.0.0.1
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  bot:
    profiles: ["bot"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://downloader:${DEV_DB_PASSWORD}@postgres:5432/downloader
      REDIS_URL: redis://redis:6379/0
      FFMPEG_PATH: ffmpeg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  youtube-pot:
    profiles: ["youtube-pot"]
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true
    # Internal token generation only; no public port and no media proxy.
volumes:
  postgres_data:
