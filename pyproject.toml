[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "downloader-bot"
version = "0.1.0"
description = "Asynchronous Telegram media downloader with independent site providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Telethon==1.45.0",
    "httpx==0.28.1",
    "asyncpg==0.32.0",
    "redis==8.1.0",
    "cryptg>=0.5,<1",
    "yt-dlp[default]==2026.8.19",
    "bgutil-ytdlp-pot-provider==2.0.2",
    "psutil>=7,<9",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<1", "imageio-ffmpeg>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/mahdiashtian/SaintCrispy"
Issues = "https://github.com/mahdiashtian/SaintCrispy/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
