name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_providers:
        description: Resolve every quality and read full public streams for all six providers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: downloader_test
          POSTGRES_USER: downloader
          POSTGRES_PASSWORD: local_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U downloader -d downloader_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://downloader:local_ci_password@127.0.0.1:5432/downloader_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      IMAGEIO_FFMPEG_EXE: ffmpeg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check main.py src tests tools
      - name: Check formatting
        run: python -m ruff format --check main.py src tests tools
      - name: Run tests
        run: python -m pytest -q
      - name: Install Node for optional live provider checks
        if: github.event_name == 'workflow_dispatch' && inputs.audit_providers
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download public qualities to EOF
        id: provider_audit
        if: github.event_name == 'workflow_dispatch' && inputs.audit_providers
        run: >-
          python tools/audit_providers.py --all-qualities --stream --strict
          --max-stream-mib 256 --case-timeout 900 --transfer-timeout 240
          --url soundcloud=https://soundcloud.com/quavoofficial/away
          --url soundcloud=https://soundcloud.com/octobersveryown/quebec
          --url soundcloud=https://soundcloud.com/gdaal/mojezeh
          --url instagram=https://www.instagram.com/reel/Chunk8-jurw/
          --url instagram=https://www.instagram.com/reel/DZwzHDsiVlk/
          --url instagram=https://www.instagram.com/p/BQ0eAlwhDrw/
          --url pinterest=https://www.pinterest.com/pin/2885187256207927/
          --url pinterest=https://www.pinterest.com/pin/664281013778109217/
          --url xvideos=https://www.xvideos.com/video4588838/_
          --url xvideos=https://www.xvideos.com/embedframe/4588838
          --url xvideos=https://www.xvideos.com/video.uptoip6a0b/_
          --url xnxx=https://www.xnxx.com/video-bykb3e9/video
          --url xnxx=https://www.xnxx.com/video-55awb78/video
          --output '${{ runner.temp }}/provider-audit.json'
      - name: Save provider verification report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.audit_providers
        uses: actions/upload-artifact@v7
        with:
          name: provider-audit
          path: '${{ runner.temp }}/provider-audit.json'
          if-no-files-found: error
