name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: downloader_test
          POSTGRES_USER: downloader
          POSTGRES_PASSWORD: local_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U downloader -d downloader_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://downloader:local_ci_password@127.0.0.1:5432/downloader_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      IMAGEIO_FFMPEG_EXE: ffmpeg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Check formatting
        run: python -m ruff format --check src tests tools
      - name: Run tests
        run: python -m pytest -q
